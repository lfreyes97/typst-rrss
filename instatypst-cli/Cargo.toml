[package]
name = "instatypst-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "instatypst"
path = "src/main.rs"

[dependencies]
instatypst-color = { path = "../instatypst-color", features = ["material"] }
instatypst-piece = { path = "../instatypst-piece" }
instatypst-bridge = { path = "../instatypst-bridge" }
anyhow = "1.0.101"
clap = { version = "4.5.58", features = ["derive"] }
image = "0.25.9"
palette = { version = "0.7.6", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
typst-syntax = "=0.15.1"
toml = { version = "1.0.0", features = ["preserve_order"] }
walkdir = "2.5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

