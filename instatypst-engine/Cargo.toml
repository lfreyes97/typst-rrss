[package]
name = "instatypst-engine"
version = "0.1.0"
edition = "2024"
description = "Typst embebido: compilar, renderizar, exportar y mapear posición ↔ fuente"
license = "MIT"

[dependencies]
typst = "=0.15.1"
typst-syntax = "=0.15.1"
typst-layout = "=0.15.1"
typst-pdf = "=0.15.1"
typst-svg = "=0.15.1"
typst-render = "=0.15.1"
typst-kit = { version = "=0.15.1", features = ["embedded-fonts", "system-files", "system-packages", "universe-packages", "scan-fonts", "datetime", "system-downloader"] }
tiny-skia = "0.12"
# Caché de memoización de Typst: se purga tras cada compilación.
comemo = "0.5.1"
