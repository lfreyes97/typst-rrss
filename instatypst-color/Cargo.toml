[package]
name = "instatypst-color"
version = "0.1.0"
edition = "2021"
description = "Colores para Instatypst: extracción desde imágenes, los roles del contrato, contraste y esquemas"
license = "MIT"

[features]
default = ["image"]
# Extraer colores de una imagen (k-means en Oklab).
image = ["dep:image", "dep:quantette"]
# Rampas de n pasos y duotonos.
gradient = ["dep:colorgrad"]
material = ["dep:material-colors", "image"]

[dependencies]
colorgrad = { version = "0.9", optional = true }
material-colors = { version = "0.5", default-features = false, features = ["std", "quantize"], optional = true }
palette = "0.7"
image = { version = "0.25", optional = true }
quantette = { version = "0.6", optional = true }
