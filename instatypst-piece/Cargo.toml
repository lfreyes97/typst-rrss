[package]
name = "instatypst-piece"
version = "0.1.0"
edition = "2021"
description = "Contrato instatypst-piece/v1: modelo, markup, validación y firmas de los estilos"
license = "MIT"

[dependencies]
anyhow = "1.0.101"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
typst-syntax = "=0.15.1"
toml = { version = "1.0.0", features = ["preserve_order"] }
