[package]
name = "instatypst-bridge"
version = "0.1.0"
edition = "2021"
description = "El puente del contrato: de un Document a la fuente Typst de cada pieza, y el informe de check"
license = "MIT"

[dependencies]
instatypst-color = { path = "../instatypst-color", features = ["material"] }
instatypst-piece = { path = "../instatypst-piece" }
anyhow = "1.0.101"
image = "0.25.9"
palette = { version = "0.7.6", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9"
toml = { version = "1.0.0", features = ["preserve_order"] }
walkdir = "2.5.0"
tracing = "0.1"
