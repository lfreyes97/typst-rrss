# =============================================================================
# posts.toml — Define tus posts para redes sociales
# =============================================================================
# Genera todos:  rrss-cli-rs build
# Genera uno:    rrss-cli-rs build --solo ciencia
# =============================================================================

# ─── Temas (Paletas de Colores) ────────────────────────────────────────────────
# Estos valores se inyectarán en Typst y se usarán para recolorear imágenes.

[themes.dark]
bg = "#0f0f0f"
surface = "#1a1a2e"
primary = "#e94560"
secondary = "#533483"
accent = "#0f3460"
text = "#f5f5f5"
muted = "#a0a0a0"
highlight = "#ffd369"

[themes.light]
bg = "#fafafa"
surface = "#ffffff"
primary = "#e94560"
secondary = "#6c5ce7"
accent = "#00b894"
text = "#1a1a2e"
muted = "#6b7280"
highlight = "#fdcb6e"

[themes.ocean]
bg = "#0a192f"
surface = "#112240"
primary = "#64ffda"
secondary = "#8892b0"
accent = "#233554"
text = "#ccd6f6"
muted = "#8892b0"
highlight = "#64ffda"

[themes.sunset]
bg = "#1a1a2e"
surface = "#16213e"
primary = "#ff6b6b"
secondary = "#feca57"
accent = "#ff9ff3"
text = "#f5f5f5"
muted = "#a0a0a0"
highlight = "#feca57"

[themes.forest]
bg = "#1b2d1b"
surface = "#2d4a2d"
primary = "#a8e6cf"
secondary = "#dcedc1"
accent = "#ffd3b6"
text = "#f0f0f0"
muted = "#98b898"
highlight = "#ffaaa5"

# ─── Valores por defecto (se heredan a cada [[post]]) ────────────────────────
# preset  → función de instatypst (carteles.<preset>); `fleurones.orla` se escribe completo.
# formato → feed-4x5 (por defecto) | feed-1x1 | story | [ancho, alto]
# ppi     → 72: un lienzo de 1080pt sale de 1080px.

[defaults]
preset = "liso"
fonts = ["/home/home/Documents/Instatypst/Fonts"]

# Args de un solo preset: epigrafe no tiene `fuente`, así que no van en [defaults.args].
[defaults.por_preset.liso]
fuente = "EB Garamond 12"
peso = 500

# ─── Posts ───────────────────────────────────────────────────────────────────
# pos  → argumentos posicionales del preset, en orden.
# args → argumentos con nombre (se suman a [defaults.args]).
# image + tema = "auto" → la paleta sale de la imagen; el fondo va en args.fondo.

[[post]]
name = "ciencia"
tema = "auto"
image = "assets/bg-ciencia.jpg"
pos = ["Cuando David vio las estrellas y el sol, alabó a Dios. ¡Qué nuevas y espectaculares bellezas tenemos ahora a la vista, gracias a los descubrimientos del siglo XX!"]
[post.args]
autor = "Ciencia: una celebración y un lamento"
fondo = { image = "assets/bg-ciencia.jpg" }

[[post]]
name = "creacion"
tema = "auto"
image = "assets/bg-ciencia.jpg"
pos = ["Cuando los incrédulos dicen que saben que el mundo es eterno o auto-existente, por un lado, están ejerciendo fe en sus presuposiciones naturalistas"]
[post.args]
autor = "La Creación bajo ataque"
fondo = { image = "assets/bg-ciencia.jpg" }

[[post]]
name = "cosmovisiones"
tema = "auto"
image = "assets/bg-ciencia.jpg"
pos = ["Una cosmovisión es una red de presuposiciones que no están verificadas por los procedimientos de la ciencia natural, acerca de la realidad, del saber y de la conducta"]
[post.args]
autor = "Definiendo las cosmovisiones"
fondo = { image = "assets/bg-ciencia.jpg" }

[[post]]
name = "oceano"
tema = "ocean"
pos = ["Dios no necesita que lo defendamos. Él es la precondición de toda defensa."]
[post.args]
autor = "La Roca de los siglos"

[[post]]
name = "atardecer"
tema = "forest"
image = "assets/bg3.jpg"
pos = ["El temor de Jehová es el principio de la sabiduría, y el conocimiento del Santo es la inteligencia."]
[post.args]
autor = "La luz en la oscuridad"
fondo = { image = "assets/bg3.jpg" }

[[post]]
name = "quote-einstein"
preset = "epigrafe"
tema = "dark"
pos = ["La imaginación es más importante que el conocimiento. El conocimiento es limitado, la imaginación rodea el mundo."]
[post.args]
autor = "Albert Einstein"
obra = "Entrevista, 1929"
estilo = "pergamino"   # los estilos de la familia C (luto, aura…) fallan con `tema` propio: bug de instatypst

[[post]]
name = "material-demo"
tema = "auto-matugen"
image = "assets/bg2.jpg"
pos = ["Tus colores se adaptan automáticamente a la imagen de fondo con el motor de Material Design 3."]
[post.args]
autor = "Diseño dinámico: Material You"
fondo = { image = "assets/bg2.jpg" }

# El carrusel (`carrusel-test`) queda fuera hasta que `build` soporte láminas
# de varias páginas (`{p}`).
